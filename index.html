<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>HyperFrames Multi-Style SVG Video</title>
  <!-- Bộ thư viện SVG & Animation (GSAP, Rough.js, Flubber, D3, Iconify) -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0b1120;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: #f8fafc;
    }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: #0b1120;
      background-image:
        radial-gradient(circle at 50% 35%, rgba(56, 189, 248, 0.14), transparent 70%),
        linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
      background-size: 100% 100%, 64px 64px, 64px 64px;
    }
    #camera-rig {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: center center;
    }
    .subtitle-bar {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #38bdf8;
      border-radius: 999px;
      padding: 14px 44px;
      font-size: 32px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <!-- HyperFrames Composition Root (15s, 1920x1080) -->
  <div
    id="stage"
    data-composition-id="main"
    data-start="0"
    data-duration="15"
    data-width="1920"
    data-height="1080"
  >
    <div id="camera-rig">
      <!-- Tiêu đề chính -->
      <div id="header" style="position: absolute; top: 36px; width: 100%; text-align: center;">
        <div style="color: #38bdf8; font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;">
          HyperFrames HTML + SVG + GSAP Engine
        </div>
        <h1 style="font-size: 52px; font-weight: 900; margin-top: 8px;">
          ĐIỀU GÌ XẢY RA NẾU MẶT TRĂNG BIẾN MẤT?
        </h1>
      </div>

      <!-- Canvas SVG chính tích hợp Rough.js, Flubber & Sci-Fi Glow -->
      <svg id="main-svg" width="1920" height="1080" viewBox="0 0 1920 1080">
        <defs>
          <filter id="hud-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.8" />
          </filter>
        </defs>

        <!-- Quỹ đạo Mặt Trăng -->
        <ellipse
          id="orbit-ring"
          cx="560"
          cy="520"
          rx="260"
          ry="120"
          fill="none"
          stroke="#38bdf8"
          stroke-width="4"
          stroke-dasharray="14 10"
          filter="url(#hud-glow)"
        />

        <!-- Nhóm hình vẽ tay bằng Rough.js -->
        <g id="rough-layer"></g>

        <!-- Biểu đồ cột SVG bên phải -->
        <g id="chart-group" transform="translate(1120, 280)">
          <rect x="0" y="0" width="660" height="480" rx="28" fill="#1e293b" stroke="#475569" stroke-width="4" />
          <text x="330" y="55" text-anchor="middle" fill="#f8fafc" font-size="30" font-weight="800">
            Biến Động Hệ Sinh Thái Trái Đất
          </text>
          <line x1="70" y1="400" x2="590" y2="400" stroke="#64748b" stroke-width="3" />

          <rect class="chart-bar" x="110" y="130" width="110" height="270" rx="12" fill="#38bdf8" transform-origin="165px 400px" />
          <text x="165" y="440" text-anchor="middle" fill="#cbd5e1" font-size="22" font-weight="700">Thủy Triều Cũ</text>

          <rect class="chart-bar" x="275" y="330" width="110" height="70" rx="12" fill="#ef4444" transform-origin="330px 400px" />
          <text x="330" y="440" text-anchor="middle" fill="#cbd5e1" font-size="22" font-weight="700">Khi Mất Trăng (-75%)</text>

          <rect class="chart-bar" x="440" y="100" width="110" height="300" rx="12" fill="#facc15" transform-origin="495px 400px" />
          <text x="495" y="440" text-anchor="middle" fill="#cbd5e1" font-size="22" font-weight="700">Tốc Độ Quay (3.5x)</text>
        </g>
      </svg>

      <!-- Iconify Vector phẳng cho Trái Đất & Mặt Trăng -->
      <div id="earth-icon" style="position: absolute; left: 490px; top: 450px;">
        <iconify-icon icon="twemoji:globe-showing-americas" width="140" height="140"></iconify-icon>
      </div>
      <div id="moon-icon" style="position: absolute; left: 760px; top: 470px;">
        <iconify-icon icon="twemoji:full-moon" width="90" height="90"></iconify-icon>
      </div>
    </div>

    <div id="subtitle" class="subtitle-bar">
      🎙️ [HyperFrames Engine]: Sẵn sàng kết xuất video SVG chuẩn từng khung hình!
    </div>
  </div>

  <script>
    // 1. Vẽ thêm khung cảnh báo bằng Rough.js (Style 1 kết hợp Style 2)
    const svgEl = document.getElementById("rough-layer");
    const rc = rough.svg(svgEl);
    const alertBox = rc.rectangle(260, 720, 600, 130, {
      stroke: "#ff6b6b",
      strokeWidth: 4,
      roughness: 1.6,
      seed: 42,
      fill: "rgba(255, 107, 107, 0.18)",
      fillStyle: "hachure",
    });
    svgEl.appendChild(alertBox);

    // 2. Khởi tạo GSAP Paused Timeline theo chuẩn bắt buộc của HyperFrames
    const tl = gsap.timeline({ paused: true });

    // Mở đầu (0s - 5s): Xuất hiện tiêu đề, Trái Đất, Mặt Trăng, sau đó Mặt Trăng biến mất ở 2.5s
    tl.from("#header", { y: -50, opacity: 0, duration: 0.7, ease: "back.out(1.6)" }, 0);
    tl.from("#earth-icon", { scale: 0, duration: 0.8, ease: "back.out(1.7)" }, 0.2);
    tl.from("#moon-icon", { scale: 0, duration: 0.8, ease: "back.out(1.7)" }, 0.5);
    tl.to("#moon-icon", { scale: 0, opacity: 0, rotation: 180, duration: 0.6, ease: "back.in(2)" }, 2.5);
    tl.from(alertBox, { opacity: 0, duration: 0.5 }, 2.8);

    // Giữa (5s - 10s): Camera Zoom/Pan sang biểu đồ bên phải + cột mọc lên
    tl.to("#camera-rig", { scale: 1.22, x: -240, y: 40, duration: 1.0, ease: "power3.inOut" }, 5.0);
    tl.from(".chart-bar", { scaleY: 0, duration: 0.8, stagger: 0.2, ease: "back.out(1.5)" }, 5.5);

    // Cuối (10s - 15s): Camera Zoom Out toàn cảnh
    tl.to("#camera-rig", { scale: 1.0, x: 0, y: 0, duration: 1.2, ease: "power3.inOut" }, 10.5);

    // Đăng ký vào window.__timelines cho HyperFrames Renderer
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
