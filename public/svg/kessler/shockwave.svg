<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Main thick ring gradient: magenta to hot-pink to orange -->
    <linearGradient id="shockwave-g-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="50%" stop-color="#ff5d8f"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>

    <!-- Outer rim crest gradient: gold to orange -->
    <linearGradient id="shockwave-g-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>

    <!-- Thinner inner ring gradient: magenta to light gold -->
    <linearGradient id="shockwave-g-inner" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="60%" stop-color="#ff5d8f"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer rim crest (leading shockwave boundary) -->
  <path d="
    M 200,16 A 184,184 0 1,0 200,384 A 184,184 0 1,0 200,16 Z
    M 200,22 A 178,178 0 1,1 200,378 A 178,178 0 1,1 200,22 Z"
    fill="url(#shockwave-g-rim)" opacity="0.55" fill-rule="evenodd"/>

  <!-- 2. Thick soft ring (expanding blast wave: ~0.7 opacity) -->
  <path d="
    M 200,22 A 178,178 0 1,0 200,378 A 178,178 0 1,0 200,22 Z
    M 200,62 A 138,138 0 1,1 200,338 A 138,138 0 1,1 200,62 Z"
    fill="url(#shockwave-g-main)" opacity="0.70" fill-rule="evenodd"/>

  <!-- 3. Thinner inner ring -->
  <path d="
    M 200,82 A 118,118 0 1,0 200,318 A 118,118 0 1,0 200,82 Z
    M 200,96 A 104,104 0 1,1 200,304 A 104,104 0 1,1 200,96 Z"
    fill="url(#shockwave-g-inner)" opacity="0.65" fill-rule="evenodd"/>

  <!-- 4. Innermost compression ripple -->
  <path d="
    M 200,118 A 82,82 0 1,0 200,282 A 82,82 0 1,0 200,118 Z
    M 200,124 A 76,76 0 1,1 200,276 A 76,76 0 1,1 200,124 Z"
    fill="#4cc9f0" opacity="0.35" fill-rule="evenodd"/>

  <!-- Secondary energy beads along wave crest -->
  <circle cx="340" cy="115" r="3.2" fill="#ffd166" opacity="0.8"/>
  <circle cx="85" cy="130" r="2.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="285" cy="330" r="3.2" fill="#ff7b00" opacity="0.8"/>
  <circle cx="110" cy="285" r="2.5" fill="#ff5d8f" opacity="0.75"/>
</svg>
