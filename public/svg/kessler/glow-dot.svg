<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Multi-stop soft radial glow: intense white core fading to transparent cyan -->
    <radialGradient id="glow-g-soft" cx="50" cy="50" r="48" fx="50" fy="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#4cc9f0" stop-opacity="0.80"/>
      <stop offset="50%" stop-color="#4cc9f0" stop-opacity="0.45"/>
      <stop offset="72%" stop-color="#4361ee" stop-opacity="0.18"/>
      <stop offset="88%" stop-color="#4361ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4361ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner intense core gradient for brilliant pinpoint illumination -->
    <radialGradient id="glow-g-core" cx="50" cy="50" r="16" fx="50" fy="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#4cc9f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer soft atmospheric aura -->
  <circle cx="50" cy="50" r="48" fill="url(#glow-g-soft)"/>

  <!-- Inner hot luminous core -->
  <circle cx="50" cy="50" r="16" fill="url(#glow-g-core)"/>

  <!-- Pinpoint brilliant center -->
  <circle cx="50" cy="50" r="4.5" fill="#ffffff"/>
</svg>
